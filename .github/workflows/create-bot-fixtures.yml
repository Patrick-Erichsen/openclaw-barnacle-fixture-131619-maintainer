name: Create bot-authored fixture PRs

on:
  workflow_dispatch:

permissions: {}

jobs:
  create-fixtures:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Create isolated bot-authored PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const baseRef = await github.rest.git.getRef({ owner, repo, ref: "heads/main" });
            const baseSha = baseRef.data.object.sha;
            const fixtures = [
              {
                branch: "codex/bot-fixture-core-runtime",
                path: "src/skills/fixture-runtime.ts",
                content: 'export const fixtureRuntimeSkillRegistry = ["core-runtime-not-standalone"];\n',
                title: "fixture: bot-authored core runtime must remain open",
                body: [
                  "Bot-authored fixture case for OpenClaw PR #131619.",
                  "",
                  "Expected: automatic `r: skill` removal and an open PR.",
                ].join("\n"),
              },
              {
                branch: "codex/bot-fixture-standalone-skill",
                path: "skills/barnacle-fixture/SKILL.md",
                content: [
                  "---",
                  "name: barnacle-fixture",
                  "description: Disposable standalone skill used only to verify PR #131619 routing.",
                  "---",
                  "",
                  "# Barnacle fixture",
                  "",
                  "This file exists only for the live GitHub API fixture.",
                  "",
                ].join("\n"),
                title: "fixture: bot-authored standalone skill must close",
                body: [
                  "Bot-authored fixture case for OpenClaw PR #131619.",
                  "",
                  "Expected: `r: skill` retention, the normal Barnacle response, and closure.",
                ].join("\n"),
              },
            ];

            for (const fixture of fixtures) {
              let branchExists = true;
              try {
                await github.rest.git.getRef({ owner, repo, ref: `heads/${fixture.branch}` });
              } catch (error) {
                if (error.status !== 404) throw error;
                branchExists = false;
              }
              if (!branchExists) {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${fixture.branch}`,
                  sha: baseSha,
                });
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: fixture.path,
                  message: `test: add ${fixture.branch.split("/").at(-1)}`,
                  content: Buffer.from(fixture.content).toString("base64"),
                  branch: fixture.branch,
                });
              }
              const existing = await github.rest.pulls.list({
                owner,
                repo,
                state: "all",
                head: `${owner}:${fixture.branch}`,
                base: "main",
                per_page: 10,
              });
              if (existing.data.length > 0) {
                core.info(`Reusing ${existing.data[0].html_url}`);
                continue;
              }
              const pull = await github.rest.pulls.create({
                owner,
                repo,
                head: fixture.branch,
                base: "main",
                title: fixture.title,
                body: fixture.body,
              });
              core.info(`Created ${pull.data.html_url}`);
            }
