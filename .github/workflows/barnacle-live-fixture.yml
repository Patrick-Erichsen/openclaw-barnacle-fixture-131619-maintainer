name: Barnacle live fixture

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: barnacle-live-fixture-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  live-fixture:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact-head source
        shell: bash
        env:
          EXPECTED_SHA256: 6de49b8cb1adc61eb1e0ecdf6e2b7a4d21cf8fac9f16de85343f668430843150
          POLICY_SHA256: 37063a0366114a160797a7df0606fc7e425ddd3000fe90bbf687b277c9424803
          BOUNDED_RESPONSE_SHA256: f7250e2e6d1d0d9416a846bb304e2346c46ee5f5e182a770be5144e826e8b41d
          REGEXP_SHA256: 966a949fc75bb560219ffac105068fb74bdc9b039e586d6093315987f571f17f
        run: |
          set -euo pipefail
          check_hash() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(sha256sum "$path" | cut -d ' ' -f 1)"
            test "$actual" = "$expected"
            echo "$path SHA-256: $actual"
          }
          check_hash scripts/github/barnacle-auto-response.mjs "$EXPECTED_SHA256"
          check_hash scripts/github/real-behavior-proof-policy.mjs "$POLICY_SHA256"
          check_hash scripts/lib/bounded-response.mjs "$BOUNDED_RESPONSE_SHA256"
          check_hash scripts/lib/regexp.mjs "$REGEXP_SHA256"

      - name: Apply bot label and exercise Barnacle through GitHub REST
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SOURCE_HEAD: 6f2ba484538838ae8ea792c2d5d290a40d7c90c6
          SOURCE_BLOB: df931a742b3c6caa44d64d086538ebcdb97036d4
          SOURCE_SHA256: 6de49b8cb1adc61eb1e0ecdf6e2b7a4d21cf8fac9f16de85343f668430843150
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const { pathToFileURL } = require("node:url");

            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const triggerAction = context.payload.action;
            const headRef = context.payload.pull_request.head.ref;
            const routingLabel = "r: skill";
            const fixtureCases = {
              "codex/fixture-mixed-skill-core": {
                name: "mixed-skill-core",
                expectedState: "open",
                expectedLabel: false,
                expectedNewBarnacleComment: false,
              },
              "codex/bot-fixture-mixed-skill-core": {
                name: "mixed-skill-core",
                expectedState: "open",
                expectedLabel: false,
                expectedNewBarnacleComment: false,
              },
              "codex/fixture-standalone-skill": {
                name: "standalone-skill",
                expectedState: "closed",
                expectedLabel: true,
                expectedNewBarnacleComment: true,
              },
              "codex/bot-fixture-standalone-skill": {
                name: "standalone-skill",
                expectedState: "closed",
                expectedLabel: true,
                expectedNewBarnacleComment: true,
              },
            };
            const fixtureCase = fixtureCases[headRef];
            if (!fixtureCase) {
              core.setFailed(`Unexpected fixture branch: ${headRef}`);
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: routingLabel });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: routingLabel,
                color: "6f42c1",
                description: "Fixture copy of OpenClaw standalone-skill routing",
              });
            }

            const commentsBefore = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullNumber,
              labels: [routingLabel],
            });

            let recordedLabelEvent;
            for (let attempt = 0; attempt < 5 && !recordedLabelEvent; attempt += 1) {
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner,
                repo,
                issue_number: pullNumber,
                per_page: 100,
              });
              recordedLabelEvent = [...events].reverse().find(
                (event) =>
                  event.event === "labeled" &&
                  event.label?.name === routingLabel &&
                  event.actor?.login === "github-actions[bot]",
              );
              if (!recordedLabelEvent) {
                await new Promise((resolve) => setTimeout(resolve, 1000));
              }
            }
            if (!recordedLabelEvent) {
              core.setFailed("The real github-actions[bot] label event was not recorded.");
              return;
            }

            const before = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            context.payload.pull_request = before.data;

            const moduleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/github/barnacle-auto-response.mjs`,
            );
            const { runBarnacleAutoResponse } = await import(moduleUrl.href);
            await runBarnacleAutoResponse({ github, context, core });

            const after = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            const commentsAfter = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const eventsAfter = await github.paginate(github.rest.issues.listEvents, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });

            const beforeLabels = before.data.labels.map((label) => label.name).sort();
            const afterLabels = after.data.labels.map((label) => label.name).sort();
            const newComments = commentsAfter.slice(commentsBefore.length);
            const removalEvent = [...eventsAfter].reverse().find(
              (event) =>
                event.event === "unlabeled" &&
                event.label?.name === routingLabel &&
                event.actor?.login === "github-actions[bot]" &&
                Number(event.id) > Number(recordedLabelEvent.id),
            );
            const assertions = {
              state: after.data.state === fixtureCase.expectedState,
              routingLabel:
                afterLabels.includes(routingLabel) === fixtureCase.expectedLabel,
              barnacleComment:
                (newComments.length > 0) === fixtureCase.expectedNewBarnacleComment,
              removalEvent: fixtureCase.expectedLabel ? !removalEvent : Boolean(removalEvent),
            };
            const passed = Object.values(assertions).every(Boolean);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const evidence = {
              schema: "openclaw-barnacle-live-fixture-v1",
              case: fixtureCase.name,
              source: {
                pullRequest: "https://github.com/openclaw/openclaw/pull/131619",
                head: process.env.SOURCE_HEAD,
                scriptBlob: process.env.SOURCE_BLOB,
                scriptSha256: process.env.SOURCE_SHA256,
              },
              fixture: {
                repository: `${owner}/${repo}`,
                pullRequest: after.data.html_url,
                run: runUrl,
                trigger: `pull_request_target/${triggerAction}`,
                recordedLabelEvent: {
                  id: recordedLabelEvent.id,
                  event: recordedLabelEvent.event,
                  label: recordedLabelEvent.label?.name,
                  actor: recordedLabelEvent.actor?.login,
                  actorType: recordedLabelEvent.actor?.type,
                  createdAt: recordedLabelEvent.created_at,
                },
              },
              before: {
                state: before.data.state,
                labels: beforeLabels,
                comments: commentsBefore.length,
              },
              after: {
                state: after.data.state,
                labels: afterLabels,
                closedBy: after.data.closed_by?.login ?? null,
                newComments: newComments.map((comment) => ({
                  author: comment.user?.login,
                  url: comment.html_url,
                })),
                routingLabelRemovalEventId: removalEvent?.id ?? null,
              },
              assertions,
              passed,
            };

            fs.writeFileSync("fixture-evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);
            await core.summary
              .addHeading(`Barnacle live fixture: ${fixtureCase.name}`)
              .addCodeBlock(JSON.stringify(evidence, null, 2), "json")
              .write();

            const marker = `<!-- openclaw-barnacle-live-fixture:${fixtureCase.name} -->`;
            const body = [
              marker,
              `## Barnacle live fixture: ${fixtureCase.name}`,
              "",
              `Result: **${passed ? "PASS" : "FAIL"}**`,
              "",
              `- Source head: \`${process.env.SOURCE_HEAD}\``,
              `- Source script SHA-256: \`${process.env.SOURCE_SHA256}\``,
              `- Recorded label event: \`${recordedLabelEvent.id}\`, actor \`${recordedLabelEvent.actor?.login}\``,
              `- Before: state \`${before.data.state}\`, labels \`${beforeLabels.join(", ")}\``,
              `- After: state \`${after.data.state}\`, labels \`${afterLabels.join(", ")}\``,
              `- Workflow run: ${runUrl}`,
              "",
              "The exact production script used real GitHub REST mutations. The repo-scoped",
              "GITHUB_TOKEN label event was read from the timeline in the same",
              "pull_request_target run because GitHub suppresses recursive workflow triggers.",
            ].join("\n");
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullNumber,
              body,
            });

            if (!passed) {
              core.setFailed(`Fixture assertions failed: ${JSON.stringify(assertions)}`);
            }

      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: barnacle-fixture-${{ github.event.pull_request.number }}
          path: fixture-evidence.json
          if-no-files-found: error
          retention-days: 30
